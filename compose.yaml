services:
  winkle-study:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      CACHE_DIR: /data/notion
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - study-cache:/data/notion
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/demo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  study-cache:
